name: iOS
on:
  push:
    branches: [ios]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Збірка й тести
        working-directory: ios
        run: |
          mkdir -p ../out
          xcodebuild -version > ../out/env.txt
          # вибираємо наявний симулятор iPhone (бажано iPhone 16 на iOS 18)
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']; best=None
          for rt,devs in d.items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if not x['name'].startswith('iPhone'): continue
                  score=(('iOS-18' in rt)*10 + (x['name']=='iPhone 16')*5 + ('Pro Max' not in x['name']))
                  if best is None or score>best[0]: best=(score,x['udid'],x['name'],rt)
          print(best[1]); print(best[2],best[3],file=sys.stderr)")
          echo "device=$UDID" >> ../out/env.txt
          set +e
          xcodebuild -project MyauDen.xcodeproj -scheme MyauDen \
            -destination "id=$UDID" \
            -resultBundlePath ../out/R.xcresult \
            CODE_SIGNING_ALLOWED=NO test > ../out/xcodebuild.log 2>&1
          echo "exit=$?" > ../out/status.txt
          # малий екран: iPhone SE
          SE=$(xcrun simctl list devices available | grep -m1 "iPhone SE" | grep -oE "[0-9A-F-]{36}")
          xcodebuild -project MyauDen.xcodeproj -scheme MyauDen -destination "id=$SE" \
            -resultBundlePath ../out/SE.xcresult -only-testing:MyauDenUITests/MyauDenUITests/testScreensOverview \
            CODE_SIGNING_ALLOWED=NO test > ../out/se.log 2>&1
          echo "se=$?" >> ../out/status.txt
          # Release-збірка для пристрою (як для App Store), без підпису
          xcodebuild -project MyauDen.xcodeproj -scheme MyauDen -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build > ../out/release.log 2>&1
          echo "release=$?" >> ../out/status.txt
          grep -E "error:|warning:" ../out/release.log | grep -v appintents | head -50 > ../out/release-summary.txt || true
          set -e
          grep -E "error:|warning: .*deprecated|Test Case .*(passed|failed)|\*\* (TEST|BUILD) (SUCCEEDED|FAILED)|XCTAssert|failed -" ../out/xcodebuild.log | head -300 > ../out/summary.txt || true
          tail -80 ../out/xcodebuild.log > ../out/tail.txt
      - name: Знімки екранів
        if: always()
        run: |
          mkdir -p out/shots out/se
          xcrun xcresulttool export attachments --path out/SE.xcresult --output-path out/se > out/attach-se.log 2>&1 || true
          (cd out/se && python3 -c "
          import json,os
          for t in json.load(open('manifest.json')):
              for a in t.get('attachments',[]):
                  s=a.get('exportedFileName'); n=a.get('suggestedHumanReadableName') or s
                  if s and s.endswith('.png') and os.path.exists(s): os.rename(s,'se-'+n.split('_')[0]+'.png')
                  elif s and os.path.exists(s): os.remove(s)
          " || true)
          rm -rf out/SE.xcresult
          xcrun xcresulttool export attachments --path out/R.xcresult --output-path out/shots > out/attach.log 2>&1 || true
          cd out/shots && if [ -f manifest.json ]; then python3 - <<'PY'
          import json, os
          m = json.load(open('manifest.json'))
          for t in m:
              test = (t.get('testIdentifier') or 'x').split('/')[-1].replace('()', '')
              for i, a in enumerate(t.get('attachments', [])):
                  src = a.get('exportedFileName'); name = a.get('suggestedHumanReadableName', src) or src
                  if not (src and os.path.exists(src)): continue
                  ext = os.path.splitext(src)[1]
                  if ext == '.png': os.rename(src, name.split('_')[0] + ext)
                  elif ext == '.txt' and name.startswith('App UI hierarchy'): os.rename(src, f'hier-{test}-{i}.txt')
                  else: os.remove(src)
          PY
          fi
          ls -la
      - name: Публікація результатів у гілку ci-results
        if: always()
        run: |
          rm -rf out/R.xcresult
          cd out
          git init -q && git checkout -q -b ci-results
          git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm "results ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
