name: iOS
on:
  push:
    branches: [ios]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Збір інформації
        run: |
          mkdir -p out
          { xcodebuild -version; xcrun simctl list runtimes; xcrun simctl list devices available | head -40; ls /Applications | grep -i xcode; } > out/report.txt 2>&1
      - name: Публікація результатів у гілку ci-results
        run: |
          cd out
          git init -q && git checkout -q -b ci-results
          git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm "results ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
